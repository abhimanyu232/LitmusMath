name: LitmusMath build and test

on:
  push

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo

jobs:
  build_job:
    runs-on: ubuntu-latest
    env:
      PROJECT: LitmusMath

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # - uses: onyxmueller/build-tag-number@v1 # - uses: einaregilsson/build-number@v3
      #   with:
      #     token: ${{secrets.github_token}}

      # - name: Install compiler and packages
      #   shell: bash
      #   # Note the current convention is to use the -S and -B options here to specify source
      #   # and build directories, but this is only available with CMake 3.13 and higher.
      #   run: |
      #     sudo apt-get install -y gcc-15 g++-15 python3-yaml cmake

      - name: Configure CMake (Create build files)
        working-directory: ${{github.workspace}}
        # shell: bash
        # CXX_FLAGS="-Wall -Werror -Wno-variadic-macros -Wno-long-long -Wno-shadow"
        # export CMAKE_OPTIONS="${CMAKE_OPTIONS} ${ENV_CMAKE_OPTIONS}"
        # export CXX_FLAGS="${CXX_FLAGS} ${ENV_CXX_FLAGS}"
        run: cmake -B build -DTESTING=ON -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build / Compile
        working-directory: ${{github.workspace}}
        # shell: bash
        run: VERBOSE=1 cmake --build build --config ${{env.BUILD_TYPE}} -j4

      - name: Run the tests
        working-directory: ${{github.workspace}}/build
        # shell: bash
        run: ctest -C ${{env.BUILD_TYPE}}